<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewsDigest Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
      color: #333;
    }
    h1 { margin-bottom: 24px; }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93b4f5; cursor: not-allowed; }
    #status { margin-bottom: 16px; color: #666; font-style: italic; }
    #summary {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      line-height: 1.6;
      display: none;
    }
    #articles { display: none; }
    .article {
      background: white;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .article a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    .article a:hover { text-decoration: underline; }
    .article .meta { font-size: 13px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>NewsDigest Agent</h1>
  <div class="search-box">
    <input type="text" id="topic" placeholder="Enter a topic (e.g. AI news)" />
    <button id="btn" onclick="fetchDigest()">Digest</button>
  </div>
  <div id="status"></div>
  <div id="summary"></div>
  <div id="articles"></div>

  <script>
    const input = document.getElementById("topic");
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") fetchDigest();
    });

    async function fetchDigest() {
      const topic = input.value.trim();
      if (!topic) return;

      const btn = document.getElementById("btn");
      const status = document.getElementById("status");
      const summaryEl = document.getElementById("summary");
      const articlesEl = document.getElementById("articles");

      btn.disabled = true;
      status.textContent = "Fetching news and generating digest...";
      summaryEl.style.display = "none";
      articlesEl.style.display = "none";

      try {
        const res = await fetch("http://127.0.0.1:8000/digest", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic }),
        });
        const data = await res.json();

        status.textContent = "";
        summaryEl.textContent = data.summary;
        summaryEl.style.display = "block";

        articlesEl.innerHTML = "<h3 style='margin-bottom:10px'>Sources</h3>" +
          data.articles.map(a =>
            `<div class="article">
              <a href="${a.url}" target="_blank">${a.title}</a>
              <div class="meta">${a.source} &middot; ${new Date(a.date).toLocaleDateString()}</div>
            </div>`
          ).join("");
        articlesEl.style.display = "block";
      } catch (err) {
        status.textContent = "Error: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
