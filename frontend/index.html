<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewsDigest Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
      color: #333;
    }
    h1 { margin-bottom: 24px; }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .controls label {
      font-size: 14px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    select {
      padding: 6px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93b4f5; cursor: not-allowed; }
    #status { margin-bottom: 16px; color: #666; font-style: italic; }
    #summary {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      line-height: 1.6;
      display: none;
      white-space: pre-wrap;
    }
    #articles { display: none; }
    .article {
      background: white;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .article a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    .article a:hover { text-decoration: underline; }
    .article .meta { font-size: 13px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>NewsDigest Agent</h1>
  <div class="search-box">
    <input type="text" id="topic" placeholder="Enter a topic (e.g. AI news)" />
    <button id="btn" onclick="fetchDigest()">Digest</button>
  </div>
  <div class="controls">
    <label>Model
      <select id="model-select">
        <option value="">Loading...</option>
      </select>
    </label>
    <label>Articles
      <select id="count-select">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="15">15</option>
      </select>
    </label>
  </div>
  <div id="status"></div>
  <div id="summary"></div>
  <div id="articles"></div>

  <script>
    const API = "http://127.0.0.1:8000";
    const input = document.getElementById("topic");
    const modelSelect = document.getElementById("model-select");
    const countSelect = document.getElementById("count-select");

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") fetchDigest();
    });

    // Load available models on page load
    async function loadModels() {
      try {
        const res = await fetch(`${API}/models`);
        const data = await res.json();
        if (data.models && data.models.length) {
          modelSelect.innerHTML = data.models.map(m =>
            `<option value="${m}">${m}</option>`
          ).join("");
        } else {
          modelSelect.innerHTML = '<option value="">No models found</option>';
        }
      } catch {
        modelSelect.innerHTML = '<option value="">Failed to load</option>';
      }
    }
    loadModels();

    function renderArticles(articles, label = "Sources") {
      const articlesEl = document.getElementById("articles");
      articlesEl.innerHTML = `<h3 style='margin-bottom:10px'>${label}</h3>` +
        articles.map(a =>
          `<div class="article">
            <a href="${a.url}" target="_blank">${a.title}</a>
            <div class="meta">${a.source} &middot; ${new Date(a.date).toLocaleDateString()}</div>
          </div>`
        ).join("");
      articlesEl.style.display = "block";
    }

    async function fetchDigest() {
      const topic = input.value.trim();
      if (!topic) return;

      const btn = document.getElementById("btn");
      const status = document.getElementById("status");
      const summaryEl = document.getElementById("summary");
      const articlesEl = document.getElementById("articles");
      const model = modelSelect.value;
      const maxResults = countSelect.value;

      btn.disabled = true;
      status.textContent = "Fetching news...";
      status.style.color = "#666";
      summaryEl.style.display = "none";
      summaryEl.textContent = "";
      articlesEl.style.display = "none";

      const params = new URLSearchParams({ topic, max_results: maxResults });
      if (model) params.set("model", model);

      try {
        const res = await fetch(`${API}/digest/stream?${params}`);
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let summaryStarted = false;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          // Process complete SSE lines
          let lines = buffer.split("\n");
          buffer = lines.pop(); // keep incomplete line in buffer

          for (const line of lines) {
            if (line.startsWith("event: articles")) {
              // Next data line has the articles payload — handled below
              continue;
            }
            if (line.startsWith("event: error")) {
              continue;
            }
            if (!line.startsWith("data: ")) continue;
            const payload = line.slice(6);

            if (payload === "[DONE]") {
              status.textContent = "";
              break;
            }

            // Check if this is the articles JSON array
            if (payload.startsWith("[")) {
              const articles = JSON.parse(payload);
              renderArticles(articles);
              status.textContent = "Generating summary...";
              continue;
            }

            // It's a summary token
            if (!summaryStarted) {
              summaryEl.style.display = "block";
              summaryStarted = true;
            }
            const token = JSON.parse(payload);
            summaryEl.textContent += token;
          }
        }
      } catch (err) {
        status.textContent = "Error: " + err.message;
        status.style.color = "#dc2626";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
